name: Deploy to GitHub Pages with Cache Busting

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-
            
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        
      - name: Build with Aggressive Cache Busting
        run: |
          BUILD_ID=$(date +%s)
          BUILD_TIME=$(date -Iseconds)
          RANDOM_HASH=$(openssl rand -hex 8)
          CACHE_BUSTER="${BUILD_ID}-${RANDOM_HASH}"
          
          echo "NEXT_PUBLIC_BUILD_ID=$CACHE_BUSTER" > .env.local
          echo "NEXT_PUBLIC_BUILD_TIME=$BUILD_TIME" >> .env.local
          
          # Clear npm cache for fresh build
          npm cache clean --force
          
          npm run build
        env:
          NODE_ENV: production
          
      - name: Add comprehensive cache busting info
        run: |
          BUILD_ID=$(date +%s)
          RANDOM_HASH=$(openssl rand -hex 8)
          CACHE_BUSTER="${BUILD_ID}-${RANDOM_HASH}"
          
          echo "Build ID: $CACHE_BUSTER" > ./out/build-info.txt
          echo "Build Date: $(date)" >> ./out/build-info.txt
          echo "Commit SHA: ${{ github.sha }}" >> ./out/build-info.txt
          echo "Run Number: ${{ github.run_number }}" >> ./out/build-info.txt
          echo "Random Hash: $RANDOM_HASH" >> ./out/build-info.txt
          
          # Add cache busting to HTML files
          find ./out -name "*.html" -type f -exec sed -i "s/<html/<html data-cache-buster=\"$CACHE_BUSTER\"/g" {} \;
          
          # Create cache manifest
          echo "{\"buildId\":\"$CACHE_BUSTER\",\"buildTime\":\"$(date -Iseconds)\",\"timestamp\":$(date +%s)}" > ./out/cache-manifest.json
          
      - name: Add .nojekyll file
        run: touch ./out/.nojekyll
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
