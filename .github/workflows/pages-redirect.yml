# Publishes the redirect page to ahammadnafiz.github.io/portfolio so old links and
# search results forward to ahammadnafiz.com. The real site is self-hosted (see deploy/).
name: Redirect old GitHub Pages site

on:
  push:
    branches: [main]
    paths: ["deploy/github-pages/**", ".github/workflows/pages-redirect.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: deploy/github-pages
      - id: deploy
        uses: actions/deploy-pages@v4
